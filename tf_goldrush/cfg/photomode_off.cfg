// =====================================================================
//  photomode_off.cfg  -  back to normal play
// =====================================================================

// ---- Undo camera changes (must run while sv_cheats is still 1) ------
// tilt 0, FOV back to normal, noclip off
script PM_Exit()
sv_noclipspeed 5

// ---- Leave tournament mode and restart the round --------------------
mp_tournament 0
mp_waitingforplayers_cancel 1
mp_restartgame 1

// ---- Undo base settings ---------------------------------------------
cl_drawhud 1
r_drawviewmodel 1
sv_cheats 0
cl_detaildist 1200                     // game default
// photomode.cfg also sets mat_picmip -10 and r_rootlod 0. If you
// normally use other values, set them here, e.g.:
// mat_picmip 0
// r_rootlod 1

// ---- Restore binds --------------------------------------------------
// These are Gold Rush's default binds. If you use different ones, check
// each key with "bind <key>" in the console (e.g. bind ctrl) before
// entering photo mode, and put your own binding on the matching line.
bind ctrl       "+duck"
unbind shift
bind alt        "+strafe"
bind mwheelup   "invprev"
bind mwheeldown "invnext"
bind mouse3     "+attack3"
bind r          "+reload"
bind f          "+use"
unbind h
bind l          "dropitem"

echo "Photo mode OFF"
