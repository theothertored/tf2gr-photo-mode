// =====================================================================
//  photomode.cfg  -  TF2 photo mode          (exit with: exec photomode_off)
//  Needs tf_goldrush/scripts/vscripts/photomode.nut
// =====================================================================
//  Ctrl  + wheel up/down : FOV -5 / +5          (10 .. 120)
//  Shift + wheel up/down : fly speed up / down  (0.1 .. 20)
//  Alt   + wheel up/down : tilt camera left / right (5 deg steps, -45 .. 45)
//  R / F                 : fly up / down
//  H                     : toggle HUD
//  Ctrl/Shift/Alt + middle click : reset just that value (FOV / speed / tilt)
//  L                     : reset FOV (90), fly speed (5), tilt (0)
//
//  Entering photo mode puts the game into tournament "ready up" state
//  (no round timer) and pauses any round timers on the map.
// =====================================================================

// ---- Base settings --------------------------------------------------
sv_cheats 1
mp_tournament 1
mp_tournament_restart                  // mp_tournament alone does nothing until this
ent_fire team_round_timer Pause
cl_drawhud 0
r_drawviewmodel 0
mat_picmip -10                         // sharpest textures
r_rootlod 0                            // full-detail models (may need a map reload)
cl_detaildist 20000                    // grass/detail props visible far away

alias pm_none ""

// ---- Script: tilt, FOV, noclip --------------------------------------
script_execute photomode
script PM_Enter()

// ---- FOV (10 .. 120 in steps of 5, handled in photomode.nut) --------
alias pm_fov_down "script PM_FovChange(-1)"
alias pm_fov_up   "script PM_FovChange(1)"
alias pm_fov_reset "script PM_FovReset()"

// ---- Fly speed (sv_noclipspeed) -------------------------------------
alias pm_spd_0_1  "sv_noclipspeed 0.1;  alias pm_spd_up pm_spd_0_25; alias pm_spd_down pm_spd_0_1"
alias pm_spd_0_25 "sv_noclipspeed 0.25; alias pm_spd_up pm_spd_0_5;  alias pm_spd_down pm_spd_0_1"
alias pm_spd_0_5  "sv_noclipspeed 0.5;  alias pm_spd_up pm_spd_1;    alias pm_spd_down pm_spd_0_25"
alias pm_spd_1    "sv_noclipspeed 1;    alias pm_spd_up pm_spd_2_5;  alias pm_spd_down pm_spd_0_5"
alias pm_spd_2_5  "sv_noclipspeed 2.5;  alias pm_spd_up pm_spd_5;    alias pm_spd_down pm_spd_1"
alias pm_spd_5    "sv_noclipspeed 5;    alias pm_spd_up pm_spd_10;   alias pm_spd_down pm_spd_2_5"
alias pm_spd_10   "sv_noclipspeed 10;   alias pm_spd_up pm_spd_15;   alias pm_spd_down pm_spd_5"
alias pm_spd_15   "sv_noclipspeed 15;   alias pm_spd_up pm_spd_20;   alias pm_spd_down pm_spd_10"
alias pm_spd_20   "sv_noclipspeed 20;   alias pm_spd_up pm_spd_20;   alias pm_spd_down pm_spd_15"

// ---- Camera tilt (keeps your current view direction) ----------------
alias pm_tilt_l "script PM_Tilt(-1)"
alias pm_tilt_r "script PM_Tilt(1)"
alias pm_tilt_reset "script PM_TiltReset()"

// ---- HUD toggle -----------------------------------------------------
alias pm_hud_on  "cl_drawhud 1; alias pm_hud_toggle pm_hud_off"
alias pm_hud_off "cl_drawhud 0; alias pm_hud_toggle pm_hud_on"
alias pm_hud_toggle pm_hud_on

// ---- Reset (L) ------------------------------------------------------
// (every "script" call sits at the start of its own alias: "; script ..."
//  on one line breaks, because the game misreads the leading space)
alias pm_reset_script "script PM_Reset()"
alias pm_reset "pm_spd_5; pm_reset_script"

// ---- Modifier keys: the wheel does nothing unless Ctrl/Shift/Alt is held
alias pm_wheel_up   pm_none
alias pm_wheel_down pm_none
alias pm_mclick     pm_none
alias +pm_ctrl  "alias pm_wheel_up pm_fov_down; alias pm_wheel_down pm_fov_up;   alias pm_mclick pm_fov_reset"
alias -pm_ctrl  "alias pm_wheel_up pm_none;     alias pm_wheel_down pm_none;     alias pm_mclick pm_none"
alias +pm_shift "alias pm_wheel_up pm_spd_up;   alias pm_wheel_down pm_spd_down; alias pm_mclick pm_spd_5"
alias -pm_shift "alias pm_wheel_up pm_none;     alias pm_wheel_down pm_none;     alias pm_mclick pm_none"
alias +pm_alt   "alias pm_wheel_up pm_tilt_l;   alias pm_wheel_down pm_tilt_r;   alias pm_mclick pm_tilt_reset"
alias -pm_alt   "alias pm_wheel_up pm_none;     alias pm_wheel_down pm_none;     alias pm_mclick pm_none"

// ---- Starting state -------------------------------------------------
pm_spd_5

// ---- Binds ----------------------------------------------------------
bind ctrl       "+pm_ctrl"
bind shift      "+pm_shift"
bind alt        "+pm_alt"
bind mwheelup   pm_wheel_up
bind mwheeldown pm_wheel_down
bind mouse3     pm_mclick
bind r          "+moveup"
bind f          "+movedown"
bind h          pm_hud_toggle
bind l          pm_reset

echo "Photo mode ON  -  exec photomode_off to exit"
